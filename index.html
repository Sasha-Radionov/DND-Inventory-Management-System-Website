<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="src/css/styles.css">
        
        <title>Inventory Management System</title>
        <script type="module" src="src/main.js"></script>
    </head>
    
    <body>
        <h2>DND Inventory Management System</h2>

        <table class="w-75" id="inventoryTable">
            <thead>
                <tr>
                    <th>Icon</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Weight</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <button id="newRowBtn" class="p-1 m-2 btn btn-success btn-lg" title="Create New Row">Create New Row</button>

        <button id="testRow" class="p-1 m-2 btn btn-primary btn-lg" title="Create Test Row">Create test row</button>
    </body>



    <div id="newRowModal" class="modal">
        <div class="modal-content">
            <span id="closeModalBtn" class="close">&times;</span>
            <ul>
                <li>
                    <p>Icon: <input type="file" id="modalIcon"></p>
                </li>
                <li>
                    <p>Name: <input type="text" id="modalName"></p>
                </li>
                <li>
                    <p>Description: <input type="text" id="modalDescription"></p>
                </li>
                <li>
                    <p>Weight: <input type="text" id="modalWeight"></p>
                </li>
                <li>
                    <p>Price: <input type="text" id="modalPrice"></p>
                </li>
            </ul>
            <button id="acceptInputsBtn" class="w-50 p-1 m-2 btn btn-success btn-lg" title="Create New Row">Done</button>
        </div>
    </div>
</html>
