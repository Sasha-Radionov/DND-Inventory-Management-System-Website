<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="src/css/styles.css">
        
        <title>Inventory Management System</title>
        <script type="module" src="src/main.js"></script>
    </head>
    
    <body>
        <h2>DND Inventory Management System</h2>

        <table class="w-75" id="inventoryTable">
            <thead>
                <tr>
                    <th>Icon</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Weight</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <button id="newRowBtn" class="p-1 m-2 btn btn-success btn-lg" title="Create New Row">Create New Row</button>
        
            <div id="newRowModal" class="modal">
                <div class="modal-content">
                    <span id="closeModalBtn" class="close">&times;</span>
                    <form id="newRowForm">    <!-- action="[URL]" sends data to selected url-->
                        <img id="iconPreview" src="src/assets/250px-PlaceholderLC.png" alt=""><br><br>
        
                        <label for="ficon">Icon: </label>
                        <input type="file" id="modalIcon" accept="image/jpeg, image/png"/><br><br>
        
                        <span class="requiredFieldStar">*</span><label for="fname">Item name: </label>
                        <input type="text" id="modalName" required/><br><br>
        
                        <label for="fdescription">Description: </label>
                        <input type="text" id="modalDescription"/><br><br>
        
                        <label for="fweight">Weight: </label>
                        <input type="text" id="modalWeight"/><br><br>
        
                        <label for="fprice">Price: </label>
                        <input type="text" id="modalPrice"/><br><br>
        
                        <input type="submit" class="w-50 p-1 m-2 btn btn-success btn-lg" value="Done">
                    </form>
                </div>
            </div>
        </body>
    </html>
